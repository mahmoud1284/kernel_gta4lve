                   "after",
                   "\tsusfs_sus_kstat_spoof(inode, stat);"),
                  # 4. Hide sus_path in fs/readdir.c (filldir / filldir64, after all local variable declarations)
                  ("fs/readdir.c",
                   "static int filldir(struct dir_context *ctx, const char *name, int namlen,",
                   "buf->error = verify_dirent_name(name, namlen);",
                   "before",
                   "\tif (susfs_is_name_sus_path(NULL, name, namlen))\n\t\treturn 0;\n"),
                  ("fs/readdir.c",
