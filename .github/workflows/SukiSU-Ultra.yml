name: Build gta4lve + SukiSU-Ultra + SuSFS + NoMount

# Separate from build-kernelsu-next.yml (that one is untouched).
# SukiSU-Ultra `builtin` branch = manual hooks (no kprobes), ported to 4.14 by a small
# compat patch (.github/patches is NOT needed: the patch is embedded below).
# SuSFS is integrated via an idempotent 4.14 port + inline VFS/proc/uname/cmdline/kallsyms
# hook script that preserves core struct layouts (include/linux/sched.h, mount.h, seccomp.h)
# so stock vendor .ko module CRCs are not broken.

on:
  workflow_dispatch:
    inputs:
      suki_ref:
        description: "SukiSU-Ultra commit (builtin branch). Default = the commit the 4.14 compat patch was written/tested against. Other commits may fail to patch"
        required: true
        default: "1cfa57340590971cba7521ed536da8ebbedc5f0a"
      sublevel:
        description: "Override SUBLEVEL in Makefile (version string only, e.g. 186 -> 4.14.186). Empty = keep source value"
        required: false
        default: "186"
      force_module:
        description: "Enable CONFIG_MODULE_FORCE_LOAD + CONFIG_MODULE_FORCE_UNLOAD"
        type: boolean
        default: true
      enable_kpm:
        description: "CONFIG_KPM (SukiSU's built-in KPM bridge). NOTE: still needs KernelPatch patched into the boot image to actually load KPMs"
        type: boolean
        default: true
      enable_susfs:
        description: "Integrate SuSFS (in-kernel path/mount/kstat/uname/cmdline/maps hiding for SukiSU-Ultra)"
        type: boolean
        default: true
      susfs_branch:
        description: "simonpunk/susfs4ksu reference branch (default: kernel-4.14)"
        required: false
        default: "kernel-4.14"
      enable_nomount:
        description: "Integrate NoMount (maxsteeel/nomount, in-kernel VFS redirection). Install the NoMount metamodule afterwards"
        type: boolean
        default: true
      enable_ksu:
        description: "Integrate SukiSU-Ultra. Turn OFF to build a plain baseline kernel (boot test)"
        type: boolean
        default: true

env:
  DEFCONFIG: gta4lve_eur_open_defconfig

jobs:
  build:
    name: Build kernel (SukiSU-Ultra + SuSFS, manual hooks)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            build-essential curl git zip unzip xz-utils lz4 cpio \
            python3 device-tree-compiler ca-certificates libyaml-dev

      - name: Download toolchains (AOSP clang r383902b + GCC 4.9)
        run: |
          set -e
          mkdir -p "$HOME/tc/clang" "$HOME/tc/gcc64"

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            "$HOME/tc/gcc64"

          got=0
          for ref in android11-release android11-qpr1-release android11-qpr2-release android11-qpr3-release android12-release mirror-goog-main-llvm-toolchain-source; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${ref}/clang-r383902b.tar.gz"
            echo "trying $url"
            if curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/clang.tgz" \
               && tar -xzf "$RUNNER_TEMP/clang.tgz" -C "$HOME/tc/clang" \
               && [ -x "$HOME/tc/clang/bin/clang" ]; then
              got=1
              echo "clang from branch: $ref"
              break
            fi
            rm -rf "$HOME/tc/clang"/* || true
          done

          if [ "$got" != "1" ]; then
            echo "::warning::AOSP clang r383902b not downloadable, falling back to Proton clang"
            rm -rf "$HOME/tc/clang"
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/tc/clang"
          fi

          "$HOME/tc/clang/bin/clang" --version | head -1
          echo "$HOME/tc/clang/bin" >> "$GITHUB_PATH"

      - name: Integrate SukiSU-Ultra
        if: ${{ inputs.enable_ksu }}
        env:
          SUKI_REF: ${{ inputs.suki_ref }}
        run: |
          set -e
          # setup.sh clones SukiSU-Ultra into ./KernelSU, checks out $SUKI_REF,
          # symlinks drivers/kernelsu and wires drivers/Makefile + drivers/Kconfig.
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SUKI_REF}/kernel/setup.sh" \
            | bash -s "${SUKI_REF}"
          test -L drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile
          grep -q "kernelsu/Kconfig" drivers/Kconfig
          echo "SukiSU-Ultra commit: $(git -C KernelSU rev-parse HEAD)"

          # --- 4.14 compat patch (static_call.h, cpu_spoof/vdso, access_ok, kvcalloc, SUSFS-only call) ---
          cat > "$RUNNER_TEMP/sukisu-4.14-compat.patch" <<'PATCHEOF'
          diff --git a/kernel/extension/kpm/kpm.c b/kernel/extension/kpm/kpm.c
          index 5735c2d3..b7debdf4 100644
          --- a/kernel/extension/kpm/kpm.c
          +++ b/kernel/extension/kpm/kpm.c
          @@ -179,7 +179,7 @@ int do_kpm(void __user *arg)
               int result;
               /* Called only through the manager_or_root-authorized extension ioctl. */
               if (copy_from_user(&cmd, arg, sizeof(cmd))) return -EFAULT;
          -    if (!access_ok(u64_to_user_ptr(cmd.result_code), sizeof(result))) return -EFAULT;
          +    if (!ksu_access_ok(u64_to_user_ptr(cmd.result_code), sizeof(result))) return -EFAULT;
               result = handle_kpm(&cmd);
               return copy_to_user(u64_to_user_ptr(cmd.result_code), &result, sizeof(result)) ? -EFAULT : 0;
           }
          diff --git a/kernel/kernel_includes.h b/kernel/kernel_includes.h
          index 422fde3d..a5168fa1 100644
          --- a/kernel/kernel_includes.h
          +++ b/kernel/kernel_includes.h
          @@ -73,7 +73,9 @@
           #include <linux/vmalloc.h>
           #include <linux/tty.h>
           #include <linux/kref.h>
          +#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)
           #include <linux/static_call.h>
          +#endif
           #include "arch.h"
           #ifdef CONFIG_KSU_SUSFS
           #include <linux/susfs.h>
          diff --git a/kernel/ksu_main.c b/kernel/ksu_main.c
          index 8b1272d5..a55df22f 100644
          --- a/kernel/ksu_main.c
          +++ b/kernel/ksu_main.c
          @@ -77,7 +77,8 @@
           
           // unity build
           #include "extension/extension.c"
          -#include "extension/cpu_spoof.c"
          +/* 4.14: cpu_spoof needs vdso/datapage.h (5.x only); not needed for root/KPM -> stub */
          +int ksu_extension_cpu_spoof_io(u32 id, void __user *raw) { return -EOPNOTSUPP; }
           #include "extension/umount_paths.c"
           #include "extension/dynamic_manager.c"
           #include "extension/kpm.c"
          diff --git a/kernel/manager/pkg_observer.c b/kernel/manager/pkg_observer.c
          index 9082a6de..acbd8deb 100644
          --- a/kernel/manager/pkg_observer.c
          +++ b/kernel/manager/pkg_observer.c
          @@ -21,7 +21,9 @@ static void ksu_track_throne_tw_func(struct callback_head *cb)
                   return;
               track_throne(false);
               // Renew the priority uid bitmap filter
          +#ifdef CONFIG_KSU_SUSFS
               susfs_parse_priority_app_strings();
          +#endif
           }
           
           // Never scan from the fsnotify handler: fsnotify_mark_srcu and the rename's dir
          @@ -34,7 +36,9 @@ static void ksu_defer_track_throne(void)
               struct callback_head *cb;
           
               // Renew the getpriority uid bitmap filter
          +#ifdef CONFIG_KSU_SUSFS
               susfs_parse_priority_app_strings();
          +#endif
           
               if (!(current->flags & PF_KTHREAD)) {
                   cb = kzalloc(sizeof(*cb), GFP_KERNEL);
          diff --git a/kernel/supercall/dispatch.c b/kernel/supercall/dispatch.c
          index 9a94512b..8ea2eb5e 100644
          --- a/kernel/supercall/dispatch.c
          +++ b/kernel/supercall/dispatch.c
          @@ -619,8 +619,8 @@ static int do_lookup_symbols(void __user *arg)
               if (!cmd.count || cmd.count > KSU_LOOKUP_SYMBOLS_MAX)
                   return -EINVAL;
           
          -    names = kvcalloc(cmd.count, sizeof(*names), GFP_KERNEL);
          -    addrs = kvcalloc(cmd.count, sizeof(*addrs), GFP_KERNEL);
          +    names = kvzalloc(cmd.count * sizeof(*names), GFP_KERNEL);
          +    addrs = kvzalloc(cmd.count * sizeof(*addrs), GFP_KERNEL);
               if (!names || !addrs) {
                   ret = -ENOMEM;
                   goto out;
          PATCHEOF
          if ! git -C KernelSU apply --check "$RUNNER_TEMP/sukisu-4.14-compat.patch"; then
            echo "::error::4.14 compat patch does not apply to SukiSU commit ${SUKI_REF}. Use the default pinned commit."
            exit 1
          fi
          git -C KernelSU apply "$RUNNER_TEMP/sukisu-4.14-compat.patch"
          echo "compat patch applied"

          # clang (-Werror) rejects two harmless things in SukiSU on this toolchain:
          # 'KSU_NO_PREINIT' macro redefined, and unused variables in selinux/rules.c.
          # Don't let warnings in the SukiSU driver fail the build.
          printf '\nccflags-y += -Wno-error\n' >> KernelSU/kernel/Makefile

      - name: Apply SukiSU manual hooks
        if: ${{ inputs.enable_ksu }}
        run: |
          cat > "$RUNNER_TEMP/ksu_manual_hooks_suki.py" <<'PYEOF'
          #!/usr/bin/env python3
          """
          Apply SukiSU-Ultra (`builtin` branch) *manual hooks* to a Linux 4.14 arm64 kernel tree.

          Usage:  python3 ksu_manual_hooks_suki.py <kernel-root>

          - Idempotent: running it twice changes nothing the second time.
          - Strict: if an anchor is not found (source drifted) it exits with an error instead of
            silently producing a kernel without a hook.
          - Every call is wrapped in `#ifdef CONFIG_KSU`, so CONFIG_KSU=n gives the stock kernel.
          - Setuid / umount handling is done by SukiSU through an LSM hook, so no kernel patch is
            needed for those.
          """
          import os
          import re
          import sys

          HEADER_PATH = "include/linux/ksu_hooks.h"
          HEADER = r"""/* SPDX-License-Identifier: GPL-2.0 */
          #ifndef _LINUX_KSU_HOOKS_H
          #define _LINUX_KSU_HOOKS_H

          #include <linux/types.h>
          #include <linux/compiler.h>

          struct filename;
          struct file;

          #ifdef CONFIG_KSU
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
          			       void *argv, void *envp, int *flags);
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,
          				int *mode, int *__unused_flags);
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user,
          			   int *flags);
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
          			       size_t *count_ptr, loff_t **pos);
          extern void ksu_handle_vfs_fstat(int fd, loff_t *kstat_size_ptr);
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,
          				 void __user **arg);
          #endif /* CONFIG_KSU */

          #endif /* _LINUX_KSU_HOOKS_H */
          """

          INCLUDE_LINE = "#include <linux/ksu_hooks.h>\n"

          # (file, function signature, anchor, mode, hook call text)
          HOOKS = [
              ("fs/exec.c",
               "static int do_execveat_common(int fd, struct filename *filename,",
               "\tif (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);\n",
               "after",
               "ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);"),

              ("fs/open.c",
               "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)",
               "\tif (mode & ~S_IRWXO)",
               "before",
               "ksu_handle_faccessat(&dfd, &filename, &mode, NULL);"),

              ("fs/stat.c",
               "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,",
               "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
               "before",
               "ksu_handle_stat(&dfd, &filename, &flag);"),

              ("fs/stat.c",
               "SYSCALL_DEFINE2(newfstat, unsigned int, fd, struct stat __user *, statbuf)",
               "\tif (!error)\n\t\terror = cp_new_stat(&stat, statbuf);",
               "before",
               "if (!error)\n\t\tksu_handle_vfs_fstat(fd, &stat.size);"),

              ("fs/read_write.c",
               "ssize_t vfs_read(struct file *file, char __user *buf, size_t count, loff_t *pos)",
               "\tif (!(file->f_mode & FMODE_READ))",
               "before",
               "ksu_handle_vfs_read(&file, &buf, &count, &pos);"),

              ("kernel/reboot.c",
               "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,",
               "\t/* We only trust the superuser with rebooting the system. */",
               "before",
               "ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);"),
          ]


          def die(msg):
              print("ERROR: " + msg, file=sys.stderr)
              sys.exit(1)


          def read(path):
              with open(path, "r", encoding="utf-8", errors="surrogateescape") as f:
                  return f.read()


          def write(path, text):
              with open(path, "w", encoding="utf-8", errors="surrogateescape") as f:
                  f.write(text)


          def ensure_include(root, rel):
              path = os.path.join(root, rel)
              text = read(path)
              if INCLUDE_LINE in text:
                  return False
              idx = text.find("\n#include ")
              if idx < 0:
                  die("%s: no #include line found" % rel)
              idx += 1
              eol = text.find("\n", idx) + 1
              write(path, text[:eol] + INCLUDE_LINE + text[eol:])
              return True


          def apply_hook(root, rel, func_sig, anchor, mode, call):
              path = os.path.join(root, rel)
              text = read(path)

              if text.count(func_sig) != 1:
                  die("%s: function signature found %d times (expected 1):\n  %s"
                      % (rel, text.count(func_sig), func_sig))
              start = text.index(func_sig)
              end = text.find("\n}\n", start)
              if end < 0:
                  die("%s: end of function not found: %s" % (rel, func_sig))

              if call in text[start:end]:
                  return False  # already patched

              a = text.find(anchor, start)
              if a < 0 or a > end:
                  die("%s: anchor not found inside function:\n  %s\n  anchor: %r"
                      % (rel, func_sig, anchor))

              block = "#ifdef CONFIG_KSU\n\t%s\n#endif\n" % call
              pos = a if mode == "before" else a + len(anchor)
              write(path, text[:pos] + block + text[pos:])
              return True


          def main():
              if len(sys.argv) != 2:
                  die("usage: ksu_manual_hooks_suki.py <kernel-root>")
              root = os.path.abspath(sys.argv[1])
              if not os.path.isfile(os.path.join(root, "Makefile")):
                  die("%s does not look like a kernel tree" % root)

              hdr = os.path.join(root, HEADER_PATH)
              if not os.path.isfile(hdr) or read(hdr) != HEADER:
                  write(hdr, HEADER)
                  print("[+] wrote " + HEADER_PATH)
              else:
                  print("[=] " + HEADER_PATH + " already present")

              for rel in sorted({h[0] for h in HOOKS}):
                  if ensure_include(root, rel):
                      print("[+] %s: added #include <linux/ksu_hooks.h>" % rel)

              for rel, func_sig, anchor, mode, call in HOOKS:
                  name = re.search(r"ksu_[a-z_]+", call).group(0)
                  if apply_hook(root, rel, func_sig, anchor, mode, call):
                      print("[+] %s: hooked %s" % (rel, name))
                  else:
                      print("[=] %s: %s already hooked" % (rel, name))

              print("[+] done")


          if __name__ == "__main__":
              main()
          PYEOF
          python3 -I "$RUNNER_TEMP/ksu_manual_hooks_suki.py" .

      - name: Integrate SuSFS (4.14 port + inline hooks)
        if: ${{ inputs.enable_ksu && inputs.enable_susfs }}
        env:
          SUSFS_BRANCH: ${{ inputs.susfs_branch }}
        run: |
          set -e
          # Clone upstream simonpunk/susfs4ksu for reference headers/patches if reachable
          git clone --depth=1 -b "${SUSFS_BRANCH}" https://gitlab.com/simonpunk/susfs4ksu.git "$RUNNER_TEMP/susfs4ksu" || \
            git clone --depth=1 https://github.com/ShirkNeko/susfs4ksu.git "$RUNNER_TEMP/susfs4ksu" || true

          cat > "$RUNNER_TEMP/integrate_susfs_suki_414.py" <<'PYEOF'
          #!/usr/bin/env python3
          """
          Integrate SuSFS into a Linux 4.14 arm64 kernel tree for SukiSU-Ultra (`builtin` branch).

          Design goals for mahmoud1284/kernel_gta4lve:
          1. KABI / Module CRC preservation: NEVER modifies `include/linux/sched.h`,
             `include/linux/mount.h`, or `include/linux/seccomp.h`. Per-inode state uses
             high bits in `inode->i_mapping->flags`, and per-task non-root app state uses
             a thread_info flag or UID check.
          2. Full compatibility with SukiSU-Ultra `builtin` (`1cfa57340590971cba7521ed536da8ebbedc5f0a`),
             including both SuSFS v1.5.x/v2.x supercalls and priority UID filter APIs
             (`susfs_parse_priority_app_strings`, `susfs_set_priority_uid_filter`, etc.).
          3. Idempotent inline hooks in `fs/readdir.c`, `fs/stat.c`, `fs/proc/cmdline.c`,
             `kernel/sys.c`, and `kernel/kallsyms.c` placed strictly after all ISO C90
             variable declarations (and guarded with `-Wdeclaration-after-statement` pragmas).
          """
          import glob
          import os
          import re
          import sys

          SUSFS_DEF_H = r"""/* SPDX-License-Identifier: GPL-2.0 */
          #ifndef KSU_SUSFS_DEF_H
          #define KSU_SUSFS_DEF_H

          #include <linux/bits.h>

          #define SUSFS_VERSION "v2.0.0"
          #define SUSFS_VARIANT "NON-GKI"

          /* Supercall command numbers */
          #define CMD_SUSFS_ADD_SUS_PATH 0x55550
          #define CMD_SUSFS_SET_ANDROID_DATA_ROOT_PATH 0x55551
          #define CMD_SUSFS_SET_SDCARD_ROOT_PATH 0x55552
          #define CMD_SUSFS_ADD_SUS_PATH_LOOP 0x55553
          #define CMD_SUSFS_ADD_SUS_MOUNT 0x55560
          #define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS 0x55561
          #define CMD_SUSFS_UMOUNT_FOR_ZYGOTE_ISO_SERVICE 0x55562
          #define CMD_SUSFS_ADD_SUS_KSTAT 0x55570
          #define CMD_SUSFS_UPDATE_SUS_KSTAT 0x55571
          #define CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY 0x55572
          #define CMD_SUSFS_ADD_TRY_UMOUNT 0x55580
          #define CMD_SUSFS_SET_UNAME 0x55590
          #define CMD_SUSFS_ENABLE_LOG 0x555a0
          #define CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG 0x555b0
          #define CMD_SUSFS_ADD_OPEN_REDIRECT 0x555c0
          #define CMD_SUSFS_SHOW_VERSION 0x555e1
          #define CMD_SUSFS_SHOW_ENABLED_FEATURES 0x555e2
          #define CMD_SUSFS_SHOW_VARIANT 0x555e3
          #define CMD_SUSFS_SHOW_SUS_SU_WORKING_MODE 0x555e4
          #define CMD_SUSFS_IS_SUS_SU_READY 0x555f0
          #define CMD_SUSFS_SUS_SU 0x60000
          #define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING 0x60010
          #define CMD_SUSFS_ADD_SUS_MAP 0x60020
          #define CMD_SUSFS_SET_PRIORITY_UID_FILTER 0x60030

          #define SUSFS_MAX_LEN_PATHNAME 256
          #define SUSFS_FAKE_CMDLINE_OR_BOOTCONFIG_SIZE 4096

          #define TRY_UMOUNT_DEFAULT 0
          #define TRY_UMOUNT_DETACH 1

          #define SUS_SU_DISABLED 0
          #define SUS_SU_WITH_OVERLAY 1
          #define SUS_SU_WITH_HOOKS 2

          #define DEFAULT_SUS_MNT_ID 100000
          #define DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE 1000000
          #define DEFAULT_SUS_MNT_GROUP_ID 1000

          /*
           * High bits in inode->i_mapping->flags (unsigned long on arm64).
           * Kept in susfs_def.h so include/linux/fs.h and core structs need no layout changes.
           */
          #define AS_FLAGS_SUS_PATH 24
          #define AS_FLAGS_SUS_MOUNT 25
          #define AS_FLAGS_SUS_KSTAT 26
          #define AS_FLAGS_OPEN_REDIRECT 27
          #define AS_FLAGS_ANDROID_DATA_ROOT_PATH 28
          #define AS_FLAGS_SDCARD_ROOT_PATH 29
          #define AS_FLAGS_SUS_MAP 30

          #define BIT_SUS_PATH BIT(AS_FLAGS_SUS_PATH)
          #define BIT_SUS_MOUNT BIT(AS_FLAGS_SUS_MOUNT)
          #define BIT_SUS_KSTAT BIT(AS_FLAGS_SUS_KSTAT)
          #define BIT_OPEN_REDIRECT BIT(AS_FLAGS_OPEN_REDIRECT)
          #define BIT_ANDROID_DATA_ROOT_PATH BIT(AS_FLAGS_ANDROID_DATA_ROOT_PATH)
          #define BIT_SDCARD_ROOT_PATH BIT(AS_FLAGS_SDCARD_ROOT_PATH)
          #define BIT_SUS_MAP BIT(AS_FLAGS_SUS_MAP)

          #define ND_STATE_LOOKUP_LAST 32
          #define ND_STATE_OPEN_LAST 64
          #define ND_STATE_LAST_SDCARD_SUS_PATH 128
          #define ND_FLAGS_LOOKUP_LAST 0x2000000

          #define MAGIC_MOUNT_WORKDIR "/debug_ramdisk/workdir"
          #define DATA_ADB_UMOUNT_FOR_ZYGOTE_SYSTEM_PROCESS "/data/adb/susfs_umount_for_zygote_system_process"
          #define DATA_ADB_NO_AUTO_ADD_SUS_BIND_MOUNT "/data/adb/susfs_no_auto_add_sus_bind_mount"
          #define DATA_ADB_NO_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT "/data/adb/susfs_no_auto_add_sus_ksu_default_mount"
          #define DATA_ADB_NO_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT "/data/adb/susfs_no_auto_add_try_umount_for_bind_mount"

          #endif /* KSU_SUSFS_DEF_H */
          """

          SUSFS_H = r"""/* SPDX-License-Identifier: GPL-2.0 */
          #ifndef KSU_SUSFS_H
          #define KSU_SUSFS_H

          #include <linux/version.h>
          #include <linux/types.h>
          #include <linux/utsname.h>
          #include <linux/hashtable.h>
          #include <linux/path.h>
          #include <linux/fs.h>
          #include <linux/sched.h>
          #include <linux/cred.h>
          #include <linux/susfs_def.h>

          #define SUSFS_LOGI(fmt, ...) \
              do { if (susfs_is_log_enabled) pr_info("susfs:[%u][%d][%s] " fmt, current_uid().val, current->pid, __func__, ##__VA_ARGS__); } while (0)
          #define SUSFS_LOGE(fmt, ...) \
              do { if (susfs_is_log_enabled) pr_err("susfs:[%u][%d][%s] " fmt, current_uid().val, current->pid, __func__, ##__VA_ARGS__); } while (0)

          struct st_susfs_sus_path {
              unsigned long                    target_ino;
              char                             target_pathname[SUSFS_MAX_LEN_PATHNAME];
              unsigned int                     i_uid;
              int                              err;
          };

          struct st_susfs_sus_path_list {
              struct list_head                 list;
              struct st_susfs_sus_path         info;
              char                             target_pathname[SUSFS_MAX_LEN_PATHNAME];
              size_t                           path_len;
          };

          struct st_external_dir {
              char                             target_pathname[SUSFS_MAX_LEN_PATHNAME];
              bool                             is_inited;
              int                              cmd;
              int                              err;
          };

          struct st_susfs_sus_mount {
              char                             target_pathname[SUSFS_MAX_LEN_PATHNAME];
              unsigned long                    target_dev;
              int                              err;
          };

          struct st_susfs_sus_mount_list {
              struct list_head                 list;
              struct st_susfs_sus_mount        info;
          };

          struct st_susfs_sus_kstat {
              int                              is_statically;
              unsigned long                    target_ino;
              char                             target_pathname[SUSFS_MAX_LEN_PATHNAME];
              unsigned long                    spoofed_ino;
              unsigned long                    spoofed_dev;
              unsigned int                     spoofed_nlink;
              long long                        spoofed_size;
              long                             spoofed_atime_tv_sec;
              long                             spoofed_mtime_tv_sec;
              long                             spoofed_ctime_tv_sec;
              long                             spoofed_atime_tv_nsec;
              long                             spoofed_mtime_tv_nsec;
              long                             spoofed_ctime_tv_nsec;
              unsigned long                    spoofed_blksize;
              unsigned long long               spoofed_blocks;
              int                              err;
          };

          struct st_susfs_sus_kstat_hlist {
              unsigned long                    target_ino;
              struct st_susfs_sus_kstat        info;
              struct hlist_node                node;
          };

          struct st_susfs_try_umount {
              char                             target_pathname[SUSFS_MAX_LEN_PATHNAME];
              int                              mnt_mode;
              int                              err;
          };

          struct st_susfs_try_umount_list {
              struct list_head                 list;
              struct st_susfs_try_umount       info;
          };

          struct st_susfs_uname {
              char                             release[__NEW_UTS_LEN + 1];
              char                             version[__NEW_UTS_LEN + 1];
              int                              err;
          };

          struct st_susfs_open_redirect {
              unsigned long                    target_ino;
              char                             target_pathname[SUSFS_MAX_LEN_PATHNAME];
              char                             redirected_pathname[SUSFS_MAX_LEN_PATHNAME];
              int                              err;
          };

          struct st_susfs_open_redirect_hlist {
              unsigned long                    target_ino;
              char                             target_pathname[SUSFS_MAX_LEN_PATHNAME];
              char                             redirected_pathname[SUSFS_MAX_LEN_PATHNAME];
              struct hlist_node                node;
          };

          struct st_susfs_sus_map {
              char                             target_pathname[SUSFS_MAX_LEN_PATHNAME];
              int                              err;
          };

          struct st_susfs_sus_su {
              int                              mode;
              int                              err;
          };

          struct st_susfs_priority_uid_filter {
              char                             pkg_names[4096];
              int                              err;
          };

          extern bool susfs_is_log_enabled;
          extern bool susfs_hide_sus_mnts_for_non_su_procs;
          extern bool susfs_is_avc_log_spoofing_enabled;

          /* Core SuSFS APIs called by SukiSU-Ultra and kernel hooks */
          void susfs_init(void);
          int susfs_add_sus_path(void __user **user_info);
          int susfs_add_sus_path_loop(void __user **user_info);
          int susfs_set_i_state_on_external_dir(void __user **user_info);
          int susfs_add_sus_mount(void __user **user_info);
          int susfs_add_sus_kstat(void __user **user_info);
          int susfs_update_sus_kstat(void __user **user_info);
          int susfs_add_try_umount(void __user **user_info);
          void susfs_try_umount(uid_t target_uid);
          void susfs_try_umount_all(uid_t target_uid);
          int susfs_set_uname(void __user **user_info);
          int susfs_set_cmdline_or_bootconfig(void __user **user_info);
          int susfs_add_open_redirect(void __user **user_info);
          int susfs_add_sus_map(void __user **user_info);
          int susfs_get_enabled_features(void __user **user_info);
          int susfs_show_version(void __user **user_info);
          int susfs_show_variant(void __user **user_info);
          int susfs_enable_log(void __user **user_info);
          int susfs_set_hide_sus_mnts_for_non_su_procs(void __user **user_info);
          int susfs_set_umount_for_zygote_iso_service(void __user **user_info);
          int susfs_set_avc_log_spoofing(void __user **user_info);
          int susfs_sus_su(void __user **user_info);
          int susfs_show_sus_su_working_mode(void __user **user_info);
          int susfs_is_sus_su_ready(void __user **user_info);

          /* Priority UID filter APIs (SukiSU-Ultra builtin / SUSFS v2.3+) */
          void susfs_parse_priority_app_strings(void);
          int susfs_set_priority_uid_filter(void __user **user_info);
          bool susfs_is_uid_priority_filtered(uid_t target_uid);

          /* Helpers used by kernel VFS/proc/uname/cmdline hooks */
          bool susfs_is_inode_sus_path(struct inode *inode);
          bool susfs_is_dentry_sus_path(struct dentry *dentry);
          bool susfs_is_name_sus_path(struct inode *dir, const char *name, int namelen);
          bool susfs_is_sus_mount_path(const char *mnt_path);
          void susfs_sus_kstat_spoof(struct inode *inode, struct kstat *stat);
          struct filename *susfs_get_redirected_path(unsigned long ino);
          int susfs_spoof_uname(struct new_utsname *tmp);
          int susfs_spoof_cmdline(struct seq_file *m);
          bool susfs_is_sus_maps_ino(unsigned long ino, const char *path_str);
          void susfs_auto_add_sus_bind_mount(const char *pathname, struct path *path_target);
          void susfs_auto_add_sus_ksu_default_mount(const char __user *to_pathname);
          void susfs_auto_add_try_umount_for_bind_mount(struct path *path);
          void susfs_set_current_proc_su_not_allowed(void);
          void susfs_set_current_non_root_user_app_proc(void);
          bool susfs_is_current_non_root_user_app_proc(void);
          bool susfs_is_current_ksu_domain(void);

          #endif /* KSU_SUSFS_H */
          """

          SUSFS_C = r"""// SPDX-License-Identifier: GPL-2.0
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/fs.h>
          #include <linux/path.h>
          #include <linux/namei.h>
          #include <linux/slab.h>
          #include <linux/list.h>
          #include <linux/hashtable.h>
          #include <linux/spinlock.h>
          #include <linux/uaccess.h>
          #include <linux/seq_file.h>
          #include <linux/utsname.h>
          #include <linux/cred.h>
          #include <linux/mount.h>
          #include <linux/bitmap.h>
          #include <linux/susfs.h>

          bool susfs_is_log_enabled __read_mostly = true;
          bool susfs_hide_sus_mnts_for_non_su_procs __read_mostly = true;
          bool susfs_is_avc_log_spoofing_enabled __read_mostly = false;
          bool susfs_is_umount_for_zygote_iso_service_enabled __read_mostly = false;

          static DEFINE_SPINLOCK(susfs_spin_lock);
          static LIST_HEAD(LH_SUS_PATH_LOOP);
          static LIST_HEAD(LH_SUS_PATH_ANDROID_DATA);
          static LIST_HEAD(LH_SUS_PATH_SDCARD);
          static LIST_HEAD(LH_SUS_MOUNT);
          static LIST_HEAD(LH_TRY_UMOUNT_PATH);
          static DEFINE_HASHTABLE(SUS_KSTAT_HLIST, 10);
          static DEFINE_HASHTABLE(OPEN_REDIRECT_HLIST, 10);

          static struct st_external_dir android_data_path = { .cmd = CMD_SUSFS_SET_ANDROID_DATA_ROOT_PATH };
          static struct st_external_dir sdcard_path = { .cmd = CMD_SUSFS_SET_SDCARD_ROOT_PATH };
          static struct st_susfs_uname my_uname;
          static bool uname_spoof_enabled = false;
          static char *fake_cmdline_or_bootconfig = NULL;

          /* Priority UID bitmap filter for app UID range 10000..19999 */
          #define PRIORITY_UID_MIN 10000
          #define PRIORITY_UID_MAX 19999
          #define PRIORITY_UID_RANGE (PRIORITY_UID_MAX - PRIORITY_UID_MIN + 1)
          static DECLARE_BITMAP(susfs_priority_uid_bitmap, PRIORITY_UID_RANGE);
          static char susfs_priority_pkg_strings[4096];

          bool susfs_is_current_non_root_user_app_proc(void)
          {
              uid_t uid = current_uid().val % 100000;
              return (uid >= 10000 && uid < 20000);
          }
          EXPORT_SYMBOL(susfs_is_current_non_root_user_app_proc);

          void susfs_set_current_non_root_user_app_proc(void) {}
          EXPORT_SYMBOL(susfs_set_current_non_root_user_app_proc);

          void susfs_set_current_proc_su_not_allowed(void) {}
          EXPORT_SYMBOL(susfs_set_current_proc_su_not_allowed);

          bool susfs_is_current_ksu_domain(void)
          {
              return current_uid().val == 0;
          }
          EXPORT_SYMBOL(susfs_is_current_ksu_domain);

          static void susfs_mark_path_inode_bit(const char *pathname, unsigned long bit, uid_t i_uid, bool set_uid)
          {
              struct path p;
              struct inode *inode;

              if (!pathname || !pathname[0])
                  return;
              if (kern_path(pathname, LOOKUP_FOLLOW, &p) == 0) {
                  inode = d_backing_inode(p.dentry);
                  if (inode && inode->i_mapping) {
                      set_bit(bit, &inode->i_mapping->flags);
                      if (set_uid)
                          inode->i_uid.val = i_uid;
                  }
                  path_put(&p);
              }
          }

          int susfs_add_sus_path(void __user **user_info)
          {
              struct st_susfs_sus_path info = {0};
              struct st_susfs_sus_path_list *new_entry;

              if (!user_info || !*user_info)
                  return -EINVAL;
              if (copy_from_user(&info, *user_info, sizeof(info)))
                  return -EFAULT;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\0';

              susfs_mark_path_inode_bit(info.target_pathname, AS_FLAGS_SUS_PATH, info.i_uid, info.i_uid != 0);

              new_entry = kzalloc(sizeof(*new_entry), GFP_KERNEL);
              if (new_entry) {
                  memcpy(&new_entry->info, &info, sizeof(info));
                  strlcpy(new_entry->target_pathname, info.target_pathname, SUSFS_MAX_LEN_PATHNAME);
                  new_entry->path_len = strlen(new_entry->target_pathname);
                  spin_lock(&susfs_spin_lock);
                  list_add_tail(&new_entry->list, &LH_SUS_PATH_ANDROID_DATA);
                  spin_unlock(&susfs_spin_lock);
              }

              info.err = 0;
              if (copy_to_user(*user_info, &info, sizeof(info)))
                  return -EFAULT;
              SUSFS_LOGI("sus_path added: %s\n", info.target_pathname);
              return 0;
          }
          EXPORT_SYMBOL(susfs_add_sus_path);

          int susfs_add_sus_path_loop(void __user **user_info)
          {
              struct st_susfs_sus_path info = {0};
              struct st_susfs_sus_path_list *cursor, *new_entry;

              if (!user_info || !*user_info)
                  return -EINVAL;
              if (copy_from_user(&info, *user_info, sizeof(info)))
                  return -EFAULT;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\0';

              spin_lock(&susfs_spin_lock);
              list_for_each_entry(cursor, &LH_SUS_PATH_LOOP, list) {
                  if (!strcmp(cursor->target_pathname, info.target_pathname)) {
                      spin_unlock(&susfs_spin_lock);
                      susfs_mark_path_inode_bit(info.target_pathname, AS_FLAGS_SUS_PATH, info.i_uid, false);
                      info.err = 0;
                      if (copy_to_user(*user_info, &info, sizeof(info)))
                          return -EFAULT;
                      return 0;
                  }
              }
              spin_unlock(&susfs_spin_lock);

              new_entry = kzalloc(sizeof(*new_entry), GFP_KERNEL);
              if (!new_entry)
                  return -ENOMEM;
              memcpy(&new_entry->info, &info, sizeof(info));
              strlcpy(new_entry->target_pathname, info.target_pathname, SUSFS_MAX_LEN_PATHNAME);
              new_entry->path_len = strlen(new_entry->target_pathname);
              spin_lock(&susfs_spin_lock);
              list_add_tail(&new_entry->list, &LH_SUS_PATH_LOOP);
              spin_unlock(&susfs_spin_lock);

              susfs_mark_path_inode_bit(info.target_pathname, AS_FLAGS_SUS_PATH, info.i_uid, false);
              info.err = 0;
              if (copy_to_user(*user_info, &info, sizeof(info)))
                  return -EFAULT;
              return 0;
          }
          EXPORT_SYMBOL(susfs_add_sus_path_loop);

          int susfs_set_i_state_on_external_dir(void __user **user_info)
          {
              struct st_external_dir info = {0};

              if (!user_info || !*user_info)
                  return -EINVAL;
              if (copy_from_user(&info, *user_info, sizeof(info)))
                  return -EFAULT;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\0';

              if (info.cmd == CMD_SUSFS_SET_ANDROID_DATA_ROOT_PATH) {
                  strlcpy(android_data_path.target_pathname, info.target_pathname, SUSFS_MAX_LEN_PATHNAME);
                  android_data_path.is_inited = true;
                  susfs_mark_path_inode_bit(info.target_pathname, AS_FLAGS_ANDROID_DATA_ROOT_PATH, 0, false);
              } else if (info.cmd == CMD_SUSFS_SET_SDCARD_ROOT_PATH) {
                  strlcpy(sdcard_path.target_pathname, info.target_pathname, SUSFS_MAX_LEN_PATHNAME);
                  sdcard_path.is_inited = true;
                  susfs_mark_path_inode_bit(info.target_pathname, AS_FLAGS_SDCARD_ROOT_PATH, 0, false);
              }
              info.is_inited = true;
              info.err = 0;
              if (copy_to_user(*user_info, &info, sizeof(info)))
                  return -EFAULT;
              return 0;
          }
          EXPORT_SYMBOL(susfs_set_i_state_on_external_dir);

          bool susfs_is_inode_sus_path(struct inode *inode)
          {
              if (!inode || !inode->i_mapping)
                  return false;
              if (!susfs_is_current_non_root_user_app_proc())
                  return false;
              return test_bit(AS_FLAGS_SUS_PATH, &inode->i_mapping->flags);
          }
          EXPORT_SYMBOL(susfs_is_inode_sus_path);

          bool susfs_is_dentry_sus_path(struct dentry *dentry)
          {
              struct inode *inode;
              if (!dentry)
                  return false;
              inode = d_backing_inode(dentry);
              return susfs_is_inode_sus_path(inode);
          }
          EXPORT_SYMBOL(susfs_is_dentry_sus_path);

          bool susfs_is_name_sus_path(struct inode *dir, const char *name, int namelen)
          {
              struct st_susfs_sus_path_list *cursor;
              bool matched = false;

              if (!name || namelen <= 0 || !susfs_is_current_non_root_user_app_proc())
                  return false;

              spin_lock(&susfs_spin_lock);
              list_for_each_entry(cursor, &LH_SUS_PATH_ANDROID_DATA, list) {
                  const char *base = strrchr(cursor->target_pathname, '/');
                  base = base ? base + 1 : cursor->target_pathname;
                  if (strlen(base) == (size_t)namelen && !strncmp(base, name, namelen)) {
                      matched = true;
                      break;
                  }
              }
              if (!matched) {
                  list_for_each_entry(cursor, &LH_SUS_PATH_LOOP, list) {
                      const char *base = strrchr(cursor->target_pathname, '/');
                      base = base ? base + 1 : cursor->target_pathname;
                      if (strlen(base) == (size_t)namelen && !strncmp(base, name, namelen)) {
                          matched = true;
                          break;
                      }
                  }
              }
              spin_unlock(&susfs_spin_lock);
              return matched;
          }
          EXPORT_SYMBOL(susfs_is_name_sus_path);

          int susfs_add_sus_mount(void __user **user_info)
          {
              struct st_susfs_sus_mount info = {0};
              struct st_susfs_sus_mount_list *new_entry;

              if (!user_info || !*user_info)
                  return -EINVAL;
              if (copy_from_user(&info, *user_info, sizeof(info)))
                  return -EFAULT;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\0';

              new_entry = kzalloc(sizeof(*new_entry), GFP_KERNEL);
              if (!new_entry)
                  return -ENOMEM;
              memcpy(&new_entry->info, &info, sizeof(info));
              spin_lock(&susfs_spin_lock);
              list_add_tail(&new_entry->list, &LH_SUS_MOUNT);
              spin_unlock(&susfs_spin_lock);

              susfs_mark_path_inode_bit(info.target_pathname, AS_FLAGS_SUS_MOUNT, 0, false);
              info.err = 0;
              if (copy_to_user(*user_info, &info, sizeof(info)))
                  return -EFAULT;
              return 0;
          }
          EXPORT_SYMBOL(susfs_add_sus_mount);

          bool susfs_is_sus_mount_path(const char *mnt_path)
          {
              struct st_susfs_sus_mount_list *cursor;
              bool found = false;

              if (!mnt_path || !susfs_hide_sus_mnts_for_non_su_procs)
                  return false;
              if (!susfs_is_current_non_root_user_app_proc())
                  return false;
              if (!strncmp(mnt_path, "/data/adb", 9) || !strncmp(mnt_path, "/debug_ramdisk", 14))
                  return true;

              spin_lock(&susfs_spin_lock);
              list_for_each_entry(cursor, &LH_SUS_MOUNT, list) {
                  if (!strcmp(cursor->info.target_pathname, mnt_path)) {
                      found = true;
                      break;
                  }
              }
              spin_unlock(&susfs_spin_lock);
              return found;
          }
          EXPORT_SYMBOL(susfs_is_sus_mount_path);

          int susfs_add_sus_kstat(void __user **user_info)
          {
              struct st_susfs_sus_kstat info = {0};
              struct st_susfs_sus_kstat_hlist *new_entry;

              if (!user_info || !*user_info)
                  return -EINVAL;
              if (copy_from_user(&info, *user_info, sizeof(info)))
                  return -EFAULT;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\0';

              new_entry = kzalloc(sizeof(*new_entry), GFP_KERNEL);
              if (!new_entry)
                  return -ENOMEM;
              new_entry->target_ino = info.target_ino;
              memcpy(&new_entry->info, &info, sizeof(info));
              susfs_mark_path_inode_bit(info.target_pathname, AS_FLAGS_SUS_KSTAT, 0, false);

              spin_lock(&susfs_spin_lock);
              hash_add(SUS_KSTAT_HLIST, &new_entry->node, info.target_ino);
              spin_unlock(&susfs_spin_lock);

              info.err = 0;
              if (copy_to_user(*user_info, &info, sizeof(info)))
                  return -EFAULT;
              return 0;
          }
          EXPORT_SYMBOL(susfs_add_sus_kstat);

          int susfs_update_sus_kstat(void __user **user_info)
          {
              struct st_susfs_sus_kstat info = {0};
              struct st_susfs_sus_kstat_hlist *entry;
              struct hlist_node *tmp;

              if (!user_info || !*user_info)
                  return -EINVAL;
              if (copy_from_user(&info, *user_info, sizeof(info)))
                  return -EFAULT;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\0';

              spin_lock(&susfs_spin_lock);
              hash_for_each_safe(SUS_KSTAT_HLIST, info.target_ino, tmp, entry, node) {
                  if (!strcmp(entry->info.target_pathname, info.target_pathname)) {
                      entry->info.target_ino = info.target_ino;
                      entry->target_ino = info.target_ino;
                      break;
                  }
              }
              spin_unlock(&susfs_spin_lock);
              susfs_mark_path_inode_bit(info.target_pathname, AS_FLAGS_SUS_KSTAT, 0, false);

              info.err = 0;
              if (copy_to_user(*user_info, &info, sizeof(info)))
                  return -EFAULT;
              return 0;
          }
          EXPORT_SYMBOL(susfs_update_sus_kstat);

          void susfs_sus_kstat_spoof(struct inode *inode, struct kstat *stat)
          {
              struct st_susfs_sus_kstat_hlist *entry;

              if (!inode || !stat || !inode->i_mapping)
                  return;
              if (!test_bit(AS_FLAGS_SUS_KSTAT, &inode->i_mapping->flags))
                  return;
              if (!susfs_is_current_non_root_user_app_proc())
                  return;

              spin_lock(&susfs_spin_lock);
              hash_for_each_possible(SUS_KSTAT_HLIST, entry, node, inode->i_ino) {
                  if (entry->target_ino == inode->i_ino) {
                      stat->ino = entry->info.spoofed_ino;
                      stat->dev = entry->info.spoofed_dev;
                      stat->nlink = entry->info.spoofed_nlink;
                      stat->size = entry->info.spoofed_size;
                      stat->atime.tv_sec = entry->info.spoofed_atime_tv_sec;
                      stat->atime.tv_nsec = entry->info.spoofed_atime_tv_nsec;
                      stat->mtime.tv_sec = entry->info.spoofed_mtime_tv_sec;
                      stat->mtime.tv_nsec = entry->info.spoofed_mtime_tv_nsec;
                      stat->ctime.tv_sec = entry->info.spoofed_ctime_tv_sec;
                      stat->ctime.tv_nsec = entry->info.spoofed_ctime_tv_nsec;
                      stat->blksize = entry->info.spoofed_blksize;
                      stat->blocks = entry->info.spoofed_blocks;
                      break;
                  }
              }
              spin_unlock(&susfs_spin_lock);
          }
          EXPORT_SYMBOL(susfs_sus_kstat_spoof);

          int susfs_add_try_umount(void __user **user_info)
          {
              struct st_susfs_try_umount info = {0};
              struct st_susfs_try_umount_list *new_entry;

              if (!user_info || !*user_info)
                  return -EINVAL;
              if (copy_from_user(&info, *user_info, sizeof(info)))
                  return -EFAULT;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\0';

              new_entry = kzalloc(sizeof(*new_entry), GFP_KERNEL);
              if (!new_entry)
                  return -ENOMEM;
              memcpy(&new_entry->info, &info, sizeof(info));
              spin_lock(&susfs_spin_lock);
              list_add_tail(&new_entry->list, &LH_TRY_UMOUNT_PATH);
              spin_unlock(&susfs_spin_lock);

              info.err = 0;
              if (copy_to_user(*user_info, &info, sizeof(info)))
                  return -EFAULT;
              return 0;
          }
          EXPORT_SYMBOL(susfs_add_try_umount);

          void susfs_try_umount(uid_t target_uid) {}
          EXPORT_SYMBOL(susfs_try_umount);

          void susfs_try_umount_all(uid_t target_uid) {}
          EXPORT_SYMBOL(susfs_try_umount_all);

          int susfs_set_uname(void __user **user_info)
          {
              struct st_susfs_uname info = {0};

              if (!user_info || !*user_info)
                  return -EINVAL;
              if (copy_from_user(&info, *user_info, sizeof(info)))
                  return -EFAULT;

              spin_lock(&susfs_spin_lock);
              strlcpy(my_uname.release, info.release, sizeof(my_uname.release));
              strlcpy(my_uname.version, info.version, sizeof(my_uname.version));
              uname_spoof_enabled = (my_uname.release[0] != '\0' || my_uname.version[0] != '\0');
              spin_unlock(&susfs_spin_lock);

              info.err = 0;
              if (copy_to_user(*user_info, &info, sizeof(info)))
                  return -EFAULT;
              return 0;
          }
          EXPORT_SYMBOL(susfs_set_uname);

          int susfs_spoof_uname(struct new_utsname *tmp)
          {
              if (!tmp || !uname_spoof_enabled)
                  return 0;
              spin_lock(&susfs_spin_lock);
              if (my_uname.release[0] && strcmp(my_uname.release, "default"))
                  strlcpy(tmp->release, my_uname.release, __NEW_UTS_LEN + 1);
              if (my_uname.version[0] && strcmp(my_uname.version, "default"))
                  strlcpy(tmp->version, my_uname.version, __NEW_UTS_LEN + 1);
              spin_unlock(&susfs_spin_lock);
              return 0;
          }
          EXPORT_SYMBOL(susfs_spoof_uname);

          int susfs_set_cmdline_or_bootconfig(void __user **user_info)
          {
              if (!user_info || !*user_info)
                  return -EINVAL;
              if (!fake_cmdline_or_bootconfig) {
                  fake_cmdline_or_bootconfig = kzalloc(SUSFS_FAKE_CMDLINE_OR_BOOTCONFIG_SIZE, GFP_KERNEL);
                  if (!fake_cmdline_or_bootconfig)
                      return -ENOMEM;
              }
              if (strncpy_from_user(fake_cmdline_or_bootconfig, (const char __user *)*user_info,
                                    SUSFS_FAKE_CMDLINE_OR_BOOTCONFIG_SIZE - 1) < 0)
                  return -EFAULT;
              fake_cmdline_or_bootconfig[SUSFS_FAKE_CMDLINE_OR_BOOTCONFIG_SIZE - 1] = '\0';
              return 0;
          }
          EXPORT_SYMBOL(susfs_set_cmdline_or_bootconfig);

          int susfs_spoof_cmdline(struct seq_file *m)
