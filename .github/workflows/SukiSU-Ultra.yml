                   "\tif (susfs_is_name_sus_path(NULL, name, namlen))\n\t\treturn 0;\n"),
                  # 5. Hide ksu/susfs symbols from /proc/kallsyms for non-root apps (before first if statement)
                  ("kernel/kallsyms.c",
                   "static int s_show(struct seq_file *m, void *p)",
                   "if (!iter->name[0])",
                   "before",
                   "#ifdef CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS\n"
