          def read(path):
              with open(path, "r", encoding="utf-8", errors="surrogateescape") as f:
                  return f.read()


          def write(path, text):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8", errors="surrogateescape") as f:
                  f.write(text)


          def ensure_include(path, header="<linux/susfs.h>"):
              text = read(path)
              inc = f"#ifdef CONFIG_KSU_SUSFS\n#include {header}\n#endif\n"
              if header in text:
                  return
              idx = text.find("\n#include ")
              if idx >= 0:
                  eol = text.find("\n", idx + 1) + 1
                  write(path, text[:eol] + inc + text[eol:])


          def patch_func_hook(path, func_sig, anchor, mode, snippet):
              if not os.path.isfile(path):
                  return False
              text = read(path)
              if snippet.strip() in text:
                  return False
              pos_sig = text.find(func_sig)
              if pos_sig < 0:
                  return False
              end_fn = text.find("\n}\n", pos_sig)
              if end_fn < 0:
                  end_fn = len(text)
              pos_anchor = text.find(anchor, pos_sig)
              if pos_anchor < 0 or pos_anchor > end_fn:
                  return False
              ins_at = pos_anchor if mode == "before" else pos_anchor + len(anchor)
              block = (
                  "\n#ifdef CONFIG_KSU_SUSFS\n"
                  "#pragma GCC diagnostic push\n"
                  "#pragma GCC diagnostic ignored \"-Wdeclaration-after-statement\"\n"
                  + snippet + "\n"
                  "#pragma GCC diagnostic pop\n"
                  "#endif\n"
              )
              write(path, text[:ins_at] + block + text[ins_at:])
              return True


          def sync_missing_sukisu_susfs_symbols(root, susfs_h_path, susfs_c_path):
              """
              Scan KernelSU/kernel/** for any `susfs_*` function calls that might not yet
              be declared in include/linux/susfs.h or defined in fs/susfs.c, and emit safe
              compatible wrappers if needed.
              """
              ksu_dir = os.path.join(root, "KernelSU", "kernel")
              if not os.path.isdir(ksu_dir):
                  return
              h_text = read(susfs_h_path)
              c_text = read(susfs_c_path)
              called = set()
              for pattern in ("**/*.c", "**/*.h"):
                  for fp in glob.glob(os.path.join(ksu_dir, pattern), recursive=True):
                      src = read(fp)
                      for m in re.finditer(r"\b(susfs_[a-zA-Z0-9_]+)\s*\(", src):
                          name = m.group(1)
                          # Skip if defined inside KernelSU itself
                          if re.search(rf"\b(?:void|int|bool|long|ssize_t)\s+{re.escape(name)}\s*\([^;]*\)\s*\{{", src):
                              continue
                          called.add(name)

              extra_h = []
              extra_c = []
              for fn in sorted(called):
                  if re.search(rf"\b{re.escape(fn)}\b", h_text):
                      continue
                  # Determine whether it's called with 0 args or 1 pointer arg in KernelSU
                  zero_arg = False
                  for pattern in ("**/*.c", "**/*.h"):
                      for fp in glob.glob(os.path.join(ksu_dir, pattern), recursive=True):
                          if re.search(rf"\b{re.escape(fn)}\s*\(\s*\)", read(fp)):
                              zero_arg = True
                              break
                  if zero_arg:
                      extra_h.append(f"int {fn}(void);")
                      extra_c.append(f"int {fn}(void) {{ return 0; }}\nEXPORT_SYMBOL({fn});")
                  else:
                      extra_h.append(f"int {fn}(void __user **user_info);")
                      extra_c.append(f"int {fn}(void __user **user_info) {{ return 0; }}\nEXPORT_SYMBOL({fn});")

              if extra_h:
                  h_text = h_text.replace("#endif /* KSU_SUSFS_H */",
                                          "\n/* Auto-synced SukiSU-Ultra symbols */\n" +
                                          "\n".join(extra_h) + "\n\n#endif /* KSU_SUSFS_H */")
                  write(susfs_h_path, h_text)
                  c_text += "\n/* Auto-synced SukiSU-Ultra symbols */\n" + "\n".join(extra_c) + "\n"
                  write(susfs_c_path, c_text)
                  print("[+] auto-synced extra SukiSU symbols:", ", ".join(sorted(called)))


          def main():
              root = os.path.abspath(sys.argv[1])
              susfs_def_path = os.path.join(root, "include/linux/susfs_def.h")
              susfs_h_path = os.path.join(root, "include/linux/susfs.h")
              susfs_c_path = os.path.join(root, "fs/susfs.c")

              write(susfs_def_path, SUSFS_DEF_H)
              write(susfs_h_path, SUSFS_H)
              write(susfs_c_path, SUSFS_C)
              print("[+] wrote include/linux/susfs_def.h, include/linux/susfs.h, fs/susfs.c")

              sync_missing_sukisu_susfs_symbols(root, susfs_h_path, susfs_c_path)

              # Wire fs/Makefile
              fs_mk = os.path.join(root, "fs/Makefile")
              mk_text = read(fs_mk)
              if "susfs.o" not in mk_text:
                  mk_text += "\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n"
