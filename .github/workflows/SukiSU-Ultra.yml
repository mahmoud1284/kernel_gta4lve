              if (fake_cmdline_or_bootconfig && fake_cmdline_or_bootconfig[0] &&
                  susfs_is_current_non_root_user_app_proc()) {
                  seq_puts(m, fake_cmdline_or_bootconfig);
                  seq_putc(m, '\n');
                  return 1;
              }
              return 0;
          }
          EXPORT_SYMBOL(susfs_spoof_cmdline);

          int susfs_add_open_redirect(void __user **user_info)
          {
              struct st_susfs_open_redirect info = {0};
              struct st_susfs_open_redirect_hlist *new_entry;

              if (!user_info || !*user_info)
                  return -EINVAL;
              if (copy_from_user(&info, *user_info, sizeof(info)))
                  return -EFAULT;
              info.target_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\0';
              info.redirected_pathname[SUSFS_MAX_LEN_PATHNAME - 1] = '\0';

              new_entry = kzalloc(sizeof(*new_entry), GFP_KERNEL);
              if (!new_entry)
                  return -ENOMEM;
              new_entry->target_ino = info.target_ino;
              strlcpy(new_entry->target_pathname, info.target_pathname, SUSFS_MAX_LEN_PATHNAME);
              strlcpy(new_entry->redirected_pathname, info.redirected_pathname, SUSFS_MAX_LEN_PATHNAME);

              susfs_mark_path_inode_bit(info.target_pathname, AS_FLAGS_OPEN_REDIRECT, 0, false);
              spin_lock(&susfs_spin_lock);
              hash_add(OPEN_REDIRECT_HLIST, &new_entry->node, info.target_ino);
              spin_unlock(&susfs_spin_lock);

              info.err = 0;
              if (copy_to_user(*user_info, &info, sizeof(info)))
                  return -EFAULT;
              return 0;
          }
          EXPORT_SYMBOL(susfs_add_open_redirect);

          struct filename *susfs_get_redirected_path(unsigned long ino)
          {
              struct st_susfs_open_redirect_hlist *entry;
              char buf[SUSFS_MAX_LEN_PATHNAME] = {0};
              bool found = false;

              spin_lock(&susfs_spin_lock);
              hash_for_each_possible(OPEN_REDIRECT_HLIST, entry, node, ino) {
                  if (entry->target_ino == ino) {
                      strlcpy(buf, entry->redirected_pathname, sizeof(buf));
                      found = true;
                      break;
                  }
              }
              spin_unlock(&susfs_spin_lock);
              if (!found)
                  return ERR_PTR(-ENOENT);
              return getname_kernel(buf);
          }
          EXPORT_SYMBOL(susfs_get_redirected_path);

