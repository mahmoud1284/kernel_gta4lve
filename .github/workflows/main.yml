name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Set up MemKernel as a module (M-OUT) with specified name
      run: |
        curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M dogi

    - name: Android kernel build
      uses: lemniskett/android-kernel-actions@master
      id: build
      env:
        NAME: Loganysl
      with:
        arch: arm64
        compiler: clang/11/binutils
        defconfig: gta4lve_eur_open_defconfig
        image: Image.gz-dtb modules

    - name: Prepare Artifacts (Smart Search)
      run: |
        echo "Creating a folder to gather all files..."
        mkdir -p Upload_Folder
        
        echo "Searching for Kernel Image..."
        find . -name "Image.gz-dtb" -type f -exec cp {} Upload_Folder/ \;
        
        echo "Searching for Kernel Modules (.ko)..."
        find . -name "*.ko" -type f -exec cp {} Upload_Folder/ \;
        
        echo "Files collected successfully!"
        ls -la Upload_Folder/

    - name: Upload Kernel and Module
      uses: actions/upload-artifact@v4
      with:
        name: moduleandkernel
        path: Upload_Folder/
