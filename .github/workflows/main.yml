name: Build gta4lve Kernel (via Kernel-Action)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: vmos0/Kernel-Action@main
        with:
          # ⚠️ غيّر ده لرابط سورس الكيرنل بتاعك الفعلي على GitHub
          kernel-url: https://github.com/mahmoud1284/kernel_gta4lve
          kernel-branch: main   # ⚠️ غيّر لاسم الفرع الصحيح لو مختلف
          config: gta4lve_eur_open_defconfig
          arch: arm64

          # التولچينز - proton-clang (حزمة كاملة فيها Clang + GCC cross-compilers لـ arm64/arm32)
          # بدل aosp-clang/aosp-gcc اللي بترفض التحميل من googlesource حاليًا
          other-clang-url: https://github.com/kdrag0n/proton-clang
          other-clang-branch: master

          # KernelSU-Next
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/rifsxd/KernelSU-Next
          ksu-version: next

          # المميزات الإضافية من قائمتك الأصلية
          rekernel: true      # Re-Kernel
          bbg: true           # BaseBandGuard (ده على الأغلب المقصود بـ "BBG")
          kprobes: true       # مطلوب لـ KPM / kprobe hooks

          # تعبئة كيرنل نهائي (Image.gz / AnyKernel3)
          anykernel3: true

          release: false      # سيبها false أول مرة لحد ما تتأكد إن البيلد بينجح
